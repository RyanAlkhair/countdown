<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-size:40px;text-align:center">
<div id="c"></div>
<script>
function u(){
let n=new Date();
let m=new Date();
m.setHours(24,0,0,0);
let d=m-n;
let h=String(Math.floor(d/3600000)).padStart(2,'0');
let i=String(Math.floor(d%3600000/60000)).padStart(2,'0');
let s=String(Math.floor(d%60000/1000)).padStart(2,'0');
document.getElementById("c").innerHTML=h+":"+i+":"+s;
}
setInterval(u,1000);u();
</script>
</body>
</html>
